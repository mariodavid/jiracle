<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="28" fill="url(#grad1)" stroke="#1557b0" stroke-width="2"/>
  
  <!-- Clock face -->
  <circle cx="32" cy="32" r="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Clock hands -->
  <line x1="32" y1="32" x2="32" y2="18" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="42" y2="32" stroke="#333333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2" fill="#333333"/>
  
  <!-- J letter overlay -->
  <text x="32" y="52" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">J</text>
  
  <!-- Time dots -->
  <circle cx="32" cy="16" r="1" fill="#666666"/>
  <circle cx="48" cy="32" r="1" fill="#666666"/>
  <circle cx="32" cy="48" r="1" fill="#666666"/>
  <circle cx="16" cy="32" r="1" fill="#666666"/>
</svg>