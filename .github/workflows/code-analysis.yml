name: Code Quality Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run code analysis
        id: analysis
        run: |
          echo "## 📊 Code Quality Analysis Results" >> analysis_results.md
          echo "" >> analysis_results.md

          # Type Coverage Analysis
          echo "### 🔍 Type Coverage Analysis" >> analysis_results.md
          echo "" >> analysis_results.md
          echo "```" >> analysis_results.md
          npm run code:coverage 2>&1 | tee type_coverage.txt || true
          cat type_coverage.txt >> analysis_results.md
          echo "```" >> analysis_results.md
          echo "" >> analysis_results.md

          # Dead Code Detection
          echo "### 🚫 Dead Code Detection" >> analysis_results.md
          echo "" >> analysis_results.md
          echo "```" >> analysis_results.md
          npm run code:unused 2>&1 | tee unused_exports.txt || true
          UNUSED_COUNT=$(wc -l < unused_exports.txt)
          cat unused_exports.txt >> analysis_results.md
          echo "```" >> analysis_results.md
          echo "" >> analysis_results.md

          # Summary
          echo "### 📈 Summary" >> analysis_results.md
          echo "" >> analysis_results.md

          # Extract type coverage percentage
          TYPE_COVERAGE=$(grep -o '[0-9]*\.[0-9]*%' type_coverage.txt | head -1 || echo "N/A")
          echo "- **Type Coverage**: $TYPE_COVERAGE" >> analysis_results.md
          echo "- **Unused Exports**: $UNUSED_COUNT items found" >> analysis_results.md
          echo "" >> analysis_results.md

          # Set outputs for PR comment
          echo "type_coverage=$TYPE_COVERAGE" >> $GITHUB_OUTPUT
          echo "unused_count=$UNUSED_COUNT" >> $GITHUB_OUTPUT

          # Quality gate thresholds (can fail CI)
          SHOULD_FAIL=false

          if [[ "$TYPE_COVERAGE" != "N/A" ]]; then
            COVERAGE_NUM=$(echo "$TYPE_COVERAGE" | sed 's/%//')
            if (( $(echo "$COVERAGE_NUM < 95" | bc -l) )); then
              echo "- ❌ **FAILED**: Type coverage below 95% ($TYPE_COVERAGE)" >> analysis_results.md
              SHOULD_FAIL=true
            else
              echo "- ✅ **PASSED**: Type coverage above 95% ($TYPE_COVERAGE)" >> analysis_results.md
            fi
          fi

          if (( UNUSED_COUNT > 50 )); then
            echo "- ❌ **FAILED**: Too many unused exports ($UNUSED_COUNT > 50)" >> analysis_results.md
            SHOULD_FAIL=true
          else
            echo "- ✅ **PASSED**: Reasonable number of unused exports ($UNUSED_COUNT)" >> analysis_results.md
          fi

          echo "" >> analysis_results.md
          if [[ "$SHOULD_FAIL" == "true" ]]; then
            echo "**❌ Code quality checks FAILED - this PR cannot be merged until issues are resolved.**" >> analysis_results.md
            echo "should_fail=true" >> $GITHUB_OUTPUT
          else
            echo "**✅ All code quality checks PASSED - PR is ready for review.**" >> analysis_results.md
            echo "should_fail=false" >> $GITHUB_OUTPUT
          fi
          echo "" >> analysis_results.md
          echo "---" >> analysis_results.md
          echo "*Generated by [Code Analysis Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*" >> analysis_results.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysisResults = fs.readFileSync('analysis_results.md', 'utf8');

            // Find existing code analysis comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('📊 Code Quality Analysis Results')
            );

            const commentBody = analysisResults;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing code analysis comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new code analysis comment');
            }

      - name: Fail build if quality gates not met
        run: |
          if [[ "${{ steps.analysis.outputs.should_fail }}" == "true" ]]; then
            echo "❌ Code quality checks failed!"
            echo "- Type coverage must be ≥95%"
            echo "- Unused exports must be ≤50"
            echo ""
            echo "Current status:"
            echo "- Type coverage: ${{ steps.analysis.outputs.type_coverage }}"
            echo "- Unused exports: ${{ steps.analysis.outputs.unused_count }}"
            echo ""
            echo "Please fix the issues above before merging this PR."
            exit 1
          else
            echo "✅ All code quality checks passed!"
          fi

      - name: Save analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-analysis-results
          path: |
            type_coverage.txt
            unused_exports.txt
            analysis_results.md
          retention-days: 30
