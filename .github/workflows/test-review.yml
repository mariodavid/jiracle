name: Test Review (Manual)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  test-review:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@test-review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@test-review')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@test-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run Test Review with Claude Code
        id: test-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Use the custom test-review slash command
          direct_prompt: |
            /test-review

          # Enable sticky comments for consistent review updates
          use_sticky_comment: true

          # Allow reading test guidelines and running analysis
          allowed_tools: 'Read,Grep,Glob,Bash'
