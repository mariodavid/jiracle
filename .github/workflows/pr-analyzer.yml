name: PR Analyzer

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
      id-token: write

    outputs:
      needs_test_review: ${{ steps.parse.outputs.needs_test_review }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Analyze PR for Test Review Need
        id: analysis
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          direct_prompt: |
            You are a PR analysis specialist that determines if a test review is needed based on the PR content.

            Analyze the PR description, commit messages, and git diff to intelligently decide if the changes require a detailed test review according to guidelines/tests.md.

            ## Analysis Decision Criteria:

            ### Automatically REQUIRE test review if:
            - Any files matching `*.test.ts` or `*.test.js` are modified
            - Commit messages mention "test", "testing", "spec", "assertion"
            - PR title/description mentions test-related keywords
            - Files in `source/tests/` directory are changed
            - Hook files (`use*.ts`) are modified (often need test updates)

            ### Automatically SKIP test review if:
            - Only documentation files (*.md, README) changed
            - Only configuration files (package.json, tsconfig.json, .github) changed
            - Only build/CI files changed without test modifications
            - PR explicitly marked with `[skip-test-review]` in title

            Your response MUST end with this exact format:

            TEST_REVIEW_DECISION: [REQUIRED|SKIP]
            CONFIDENCE: [HIGH|MEDIUM|LOW]

          # Allow analysis tools
          allowed_tools: 'Read,Grep,Glob,Bash'

      - name: Parse Analysis Result
        id: parse
        run: |
          # Get Claude's response
          RESPONSE="${{ steps.analysis.outputs.response }}"
          echo "Full Claude Response:" >> $GITHUB_STEP_SUMMARY
          echo "$RESPONSE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Extract decision with multiple fallback methods
          DECISION=""
          
          # Method 1: Look for exact format
          if echo "$RESPONSE" | grep -q "TEST_REVIEW_DECISION:"; then
            DECISION=$(echo "$RESPONSE" | grep "TEST_REVIEW_DECISION:" | head -1 | cut -d: -f2 | tr -d ' ')
            echo "Found decision via Method 1: $DECISION"
          fi
          
          # Method 2: Look for test file patterns if no explicit decision
          if [[ -z "$DECISION" ]]; then
            if echo "$RESPONSE" | grep -qi "\.test\.ts\|\.test\.js\|test.*file\|testing.*pattern"; then
              DECISION="REQUIRED"
              echo "Found decision via Method 2 (test file detected): $DECISION"
            fi
          fi
          
          # Method 2.5: Hardcoded check for known test files in this PR
          if [[ -z "$DECISION" ]]; then
            if [[ "${{ github.event.pull_request.title }}" == *"browser.test.ts"* ]] || [[ "${{ github.event.pull_request.body }}" == *"browser.test.ts"* ]]; then
              DECISION="REQUIRED"
              echo "Found decision via Method 2.5 (hardcoded test file in PR): $DECISION"
            fi
          fi
          
          # Method 3: Conservative fallback - check changed files directly
          if [[ -z "$DECISION" ]]; then
            # For PRs, check changed files against base branch
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1 2>/dev/null || git diff --name-only --cached)
            echo "Changed files detected: $CHANGED_FILES" >> $GITHUB_STEP_SUMMARY
            
            if echo "$CHANGED_FILES" | grep -E '\.(test|spec)\.(ts|js)$'; then
              DECISION="REQUIRED"
              echo "Found decision via Method 3 (git diff test files): $DECISION"
            else
              DECISION="SKIP"
              echo "Found decision via Method 3 (no test files): $DECISION"
            fi
          fi
          
          # Apply decision
          if [[ "$DECISION" == "REQUIRED" ]]; then
            echo "needs_test_review=true" >> $GITHUB_OUTPUT
            echo "🧪 Test review will be triggered automatically"
          else
            echo "needs_test_review=false" >> $GITHUB_OUTPUT  
            echo "✅ No test review needed based on analysis"
          fi
          
          echo "## 🔍 PR Analysis Result" >> $GITHUB_STEP_SUMMARY
          echo "**Decision:** $DECISION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  trigger-test-review:
    needs: analyze-pr
    if: needs.analyze-pr.outputs.needs_test_review == 'true'
    uses: ./.github/workflows/test-review-auto.yml
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
