name: Test Review (Automatic)

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  test-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run Automatic Test Review
        id: test-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Use the custom test-review slash command
          direct_prompt: |
            /test-review

          # Enable sticky comments for consistent review updates
          use_sticky_comment: true

          # Allow reading test guidelines and running analysis
          allowed_tools: 'Read,Grep,Glob,Bash'

      - name: Log Review Completion
        run: |
          echo "## 🧪 Automatic Test Review Completed" >> $GITHUB_STEP_SUMMARY
          echo "Test review has been automatically triggered and completed." >> $GITHUB_STEP_SUMMARY
          echo "Check the PR comments for detailed feedback." >> $GITHUB_STEP_SUMMARY
