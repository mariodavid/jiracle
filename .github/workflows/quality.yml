name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: TypeScript compilation check
      run: npm run build
    
    - name: Code formatting check
      run: npx prettier --check .
    
    - name: Test execution (without build)
      run: npx ava
      
    - name: Upload test coverage (if available)
      run: echo "Coverage reporting can be added here if needed"