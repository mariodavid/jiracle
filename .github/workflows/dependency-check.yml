name: Dependency Architecture Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-check:
    name: Check Architectural Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency-cruiser check
        run: npm run deps:check

      - name: Generate dependency report (on failure)
        if: failure()
        run: |
          npm run deps:report
          echo "::notice title=Dependency Violations::Check the generated dependency-violations.html for details"

      - name: Upload dependency report artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-violations-report
          path: dependency-violations.html
          retention-days: 7
